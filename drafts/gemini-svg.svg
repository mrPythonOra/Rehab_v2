<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Oracle Crimson Gradients -->
    <linearGradient id="oracleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <linearGradient id="oracleRedGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Medical Cyan/Teal Gradients -->
    <linearGradient id="medCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="pillWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Gold/Amber Accents -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow-main" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  
  <!-- Outer Subtle Tech Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>

  <g filter="url(#shadow-main)">
    
    <!-- BACKGROUND LAYER: Oracle Portal / O-Ring -->
    <path d="M 256,76 
             C 355,76 436,157 436,256 
             C 436,355 355,436 256,436 
             C 157,436 76,355 76,256 
             C 76,157 157,76 256,76 Z 
             M 256,126 
             C 184,126 126,184 126,256 
             C 126,328 184,386 256,386 
             C 328,386 386,328 386,256 
             C 386,184 328,126 256,126 Z" 
          fill="url(#oracleRed)" />

    <!-- Ring Inner Glow/Highlight Edge -->
    <path d="M 256,126 A 130 130 0 0 1 386,256" fill="none" stroke="#FFA3A3" stroke-width="3" opacity="0.3"/>

    <!-- FOREGROUND / CENTER: Tree & Medication Fusion -->
    
    <!-- Tree Trunk / Organic Base -->
    <path d="M 246,386 
             C 246,340 230,305 220,280 
             C 214,265 210,250 210,230 
             C 210,195 230,170 256,170 
             C 282,170 302,195 302,230 
             C 302,250 298,265 292,280 
             C 282,305 266,340 266,386 Z" 
          fill="#0F172A"/>

    <!-- Left Root Arc -->
    <path d="M 230,330 C 200,345 165,355 140,358" fill="none" stroke="url(#medCyan)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <!-- Right Root Arc -->
    <path d="M 282,330 C 312,345 347,355 372,358" fill="none" stroke="url(#medCyan)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

    <!-- Digital Branch Circuit Lines extending outwards -->
    <g stroke-width="3" stroke-linecap="round" fill="none">
      <!-- Left branches -->
      <path d="M 222,250 C 190,240 160,210 145,185" stroke="url(#medCyan)"/>
      <path d="M 180,226 C 160,210 140,205 125,210" stroke="url(#medCyan)" opacity="0.7"/>
      
      <!-- Right branches -->
      <path d="M 290,250 C 322,240 352,210 367,185" stroke="url(#medCyan)"/>
      <path d="M 332,226 C 352,210 372,205 387,210" stroke="url(#medCyan)" opacity="0.7"/>

      <!-- Center top branch -->
      <path d="M 256,180 L 256,135" stroke="url(#medCyan)"/>
    </g>

    <!-- Tree Foliage / Digital Network Nodes -->
    <g fill="url(#medCyan)">
      <circle cx="145" cy="185" r="7" filter="url(#glow-light)"/>
      <circle cx="125" cy="210" r="4.5"/>
      <circle cx="367" cy="185" r="7" filter="url(#glow-light)"/>
      <circle cx="387" cy="210" r="4.5"/>
      <circle cx="256" cy="135" r="8" filter="url(#glow-light)"/>
      <circle cx="190" cy="160" r="5.5"/>
      <circle cx="322" cy="160" r="5.5"/>
      <circle cx="220" cy="140" r="4"/>
      <circle cx="292" cy="140" r="4"/>
    </g>

    <!-- MEDICATION ELEMENT 1: Floating Cross (Health/Pharma Signal) -->
    <g transform="translate(256, 95) scale(0.85)">
      <path d="M -12,-4 L -4,-4 L -4,-12 C -4,-14.2 -2.2,-16 0,-16 C 2.2,-16 4,-14.2 4,-12 L 4,-4 L 12,-4 C 14.2,-4 16,-2.2 16,0 C 16,2.2 14.2,4 12,4 L 4,4 L 4,12 C 4,14.2 2.2,16 0,16 C -2.2,16 -4,14.2 -4,12 L -4,4 L -12,4 C -14.2,4 -16,2.2 -16,0 C -16,-2.2 -14.2,-4 -12,-4 Z" 
            fill="url(#goldGradient)"/>
    </g>

    <!-- MEDICATION ELEMENT 2: Centerpiece Capsule (Sits in tree trunk core) -->
    <g transform="translate(256, 260) rotate(-30)" filter="url(#glow-light)">
      <!-- Capsule Outer Container/Shadow -->
      <rect x="-24" y="-48" width="48" height="96" rx="24" fill="#0F172A" opacity="0.3"/>
      
      <!-- Capsule Top Half (White) -->
      <path d="M -20,-44 L 20,-44 A 20 20 0 0 1 20,-4 L -20,-4 A 20 20 0 0 1 -20,-44 Z" fill="url(#pillWhite)"/>
      <!-- Pill Highlight -->
      <path d="M -12,-36 A 12 12 0 0 1 4,-40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

      <!-- Capsule Bottom Half (Oracle Red) -->
      <path d="M -20,4 L 20,4 A 20 20 0 0 1 -20,44 L -20,4 A 20 20 0 0 1 20,4 Z" fill="url(#oracleRedGlass)"/>
      
      <!-- Capsule Center Band -->
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#0F172A" stroke-width="3" opacity="0.4"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#FDE047" stroke-width="1.5"/>

      <!-- Inner Healing Sparkle / Data Leaf inside Capsule -->
      <path d="M 0,-22 C 8,-22 10,-14 10,-10 C 10,-2 0,6 0,6 C 0,6 -10,-2 -10,-10 C -10,-14 -8,-22 0,-22 Z" fill="url(#medCyan)" opacity="0.85"/>
    </g>

    <!-- Leaves / Data Sparks Emerging from Capsule -->
    <path d="M 225,220 C 215,200 220,185 235,180 C 235,195 240,210 225,220 Z" fill="url(#goldGradient)"/>
    <path d="M 287,220 C 297,200 292,185 277,180 C 277,195 272,210 287,220 Z" fill="url(#medCyan)"/>

  </g>

  <!-- Accent Sparkles -->
  <circle cx="390" cy="130" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="110" cy="330" r="3" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="340" cy="360" r="2" fill="#38BDF8" opacity="0.8"/>
</svg>
